# =============================================================================
# Configuration Supabase — HBG Labs Client Platform
# =============================================================================
# `project_id` sert de préfixe aux conteneurs de la stack locale. Il n'a pas à
# correspondre à la référence du projet distant : celle-ci est établie par
# `supabase link` et conservée dans supabase/.temp/, hors du dépôt.
project_id = "hbg-labs-client-platform"

[api]
enabled = true
port = 54321
# `public` seul est exposé par l'API REST. `storage` et `graphql_public` sont
# servis par leurs propres routes ; ajouter d'autres schémas ici les rendrait
# interrogeables depuis la clé anon.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Plafond de lignes par requête. Empêche qu'un oubli de pagination ne ramène
# toute une table — et évite qu'un appel non paginé ne serve d'outil
# d'aspiration si une policy venait à être trop permissive.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Interception des emails en développement : aucun message réel n'est envoyé
# depuis la stack locale.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Plafond global. Les limites par bucket, plus strictes, sont définies dans la
# migration 15 (org-logos 2 Mio, ticket-attachments 25 Mio, avatars 1 Mio).
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]

# Une heure. Assez court pour qu'une révocation de rôle prenne effet
# rapidement, assez long pour ne pas interrompre une session de travail.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Inscription ouverte : le parcours de §8 va du visiteur au compte client.
enable_signup = true

[auth.email]
enable_signup = true
# Vérification d'email exigée (§9). En local, les messages arrivent dans
# Inbucket (port 54324).
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

# Supabase impose 6 caractères par défaut. 10 avec exigence de variété : un
# compte client donne accès à des données d'entreprise et à l'historique de
# facturation.
[auth.email.password]
min_length = 10
required_characters = "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"

[edge_runtime]
enabled = true
policy = "oneshot"

# -----------------------------------------------------------------------------
# Fonctions Edge — Stripe (§19, §21)
# -----------------------------------------------------------------------------
# Trois points d'entrée, deux régimes d'authentification.
#
# `stripe-checkout` et `stripe-portal` agissent AU NOM D'UN UTILISATEUR : le
# runtime vérifie son jeton, puis la fonction demande à PostgreSQL, par
# `is_org_owner`, s'il a le droit de gérer la facturation de cette entreprise.
#
# `stripe-webhook` n'a pas d'utilisateur. Stripe appelle sans jeton Supabase :
# `verify_jwt = true` rejetterait tous les événements avec un 401 que Stripe
# signalerait comme une panne de notre côté. L'authentification repose ici sur
# la signature `stripe-signature`, vérifiée avant toute lecture de la charge
# utile — c'est la seule preuve que l'appel vient bien de Stripe.

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

# -----------------------------------------------------------------------------
# Fonction Edge — courriels transactionnels (§26)
# -----------------------------------------------------------------------------
# `verify_jwt = true` : le runtime valide le jeton, et la fonction exige ensuite
# que ce jeton soit celui du backend (`role = service_role`). Sans ce second
# contrôle, tout client connecté pourrait déclencher la vidange de la file de
# courriels — l'appel est authentifié, il n'est pas pour autant légitime.
#
# L'ordonnancement est assuré par pg_cron, à l'intérieur de Supabase. Voir
# docs/SETUP.md §9.

[functions.notifications-dispatch]
verify_jwt = true

# -----------------------------------------------------------------------------
# Fonction Edge — état réel des sites clients (§17, §33)
# -----------------------------------------------------------------------------
# Même régime que la dépêche de courriels : jeton vérifié par le runtime, puis
# `role = service_role` exigé par la fonction. Elle porte un jeton Vercel, qui
# ouvre bien plus que la lecture d'un statut ; son déclenchement n'a rien d'un
# geste d'utilisateur.
#
# Ordonnancement par pg_cron, toutes les quinze minutes. Voir docs/SETUP.md §11.

[functions.vercel-refresh]
verify_jwt = true
